[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nora-interviewer"
version = "0.3.0"
description = "Provider-neutral real-time AI interview orchestration service."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Mahmoud S. Hossam Eldin"}]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
auth = ["PyJWT[crypto]>=2.14,<3"]
voice = ["websockets>=14,<16"]
postgres = [
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "websockets>=14,<16",
]
dev = [
  "pytest>=8",
  "PyJWT[crypto]>=2.14,<3",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
]

[project.scripts]
nora-interviewer = "nora_interviewer.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/nora_interviewer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
